< PARAM TYPE=FILE NAME=CPU_ONLINE >
CORE_0 /sys/devices/system/cpu/cpu0/online
CORE_1 /sys/devices/system/cpu/cpu1/online
CORE_2 /sys/devices/system/cpu/cpu2/online
CORE_3 /sys/devices/system/cpu/cpu3/online
CORE_4 /sys/devices/system/cpu/cpu4/online
CORE_5 /sys/devices/system/cpu/cpu5/online
CORE_6 /sys/devices/system/cpu/cpu6/online
CORE_7 /sys/devices/system/cpu/cpu7/online
CORE_8 /sys/devices/system/cpu/cpu8/online
CORE_9 /sys/devices/system/cpu/cpu9/online
CORE_10 /sys/devices/system/cpu/cpu10/online
CORE_11 /sys/devices/system/cpu/cpu11/online
CORE_12 /sys/devices/system/cpu/cpu12/online
CORE_13 /sys/devices/system/cpu/cpu13/online

#
# For GPU_POWER_GATING, below bit definition is referred in the nvpmodel:
# +---------+--------------------------------+
# | Bits    | Mask                           |
# +---------+--------------------------------+
# | [ 0: 2] | NV_FUSE_CTRL_OPT_FBP[0:2]      |
# | [ 3: 6] | NV_FUSE_CTRL_OPT_TPC_GPC0[0:3] |
# | [ 7:10] | NV_FUSE_CTRL_OPT_TPC_GPC1[0:3] |
# | [11:13] | NV_FUSE_CTRL_OPT_TPC_GPC2[0:2] |
# | [14:31] | Reserved                       |
# +---------+--------------------------------+
#
< PARAM TYPE=FILE NAME=GPU_POWER_GATING >
GPU_PG_MASK /sys/bus/pci/devices/0000:01:00.0/gpu_pg_mask
GPU_PG_MASK_KNEXT /sys/bus/pci/devices/0000:01:00.0/gpu_pg_mask

< PARAM TYPE=FILE NAME=GPU_POWER_CONTROL_ENABLE >
GPU_PWR_CNTL_EN /sys/devices/platform/bus@0/d0b0000000.pcie/pci0000:00/0000:00:00.0/0000:01:00.0/power/control
GPU_PWR_CNTL_EN_KNEXT /sys/devices/platform/bus@0/d0b0000000.pcie/pci0000:00/0000:00:00.0/0000:01:00.0/power/control

